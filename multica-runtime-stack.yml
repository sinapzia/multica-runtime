version: "3.8"

# Multica agent runtime on Docker Swarm — BASE file. The image ships both
# Claude Code and OpenCode (see Dockerfile); this file alone authenticates
# neither. Combine it with one or both provider overlays under overlays/:
#
#   # Claude only
#   docker stack deploy -c multica-runtime-stack.yml -c overlays/claude.yml \
#     --resolve-image never multica
#
#   # OpenCode only
#   docker stack deploy -c multica-runtime-stack.yml -c overlays/opencode.yml \
#     --resolve-image never multica
#
#   # Both
#   docker stack deploy -c multica-runtime-stack.yml -c overlays/claude.yml \
#     -c overlays/opencode.yml --resolve-image never multica
#
# Build the image first, ON THE MANAGER (see "Installing on a fresh host" in
# RUNBOOK.md — the secrets this file plus the overlay(s) you pick reference
# have to exist before the first deploy, and if you deploy through Portainer
# the agent needs AGENT_CLUSTER_ADDR set or roughly half of all deploys land
# on a worker and fail to create the network).
#
# Portainer can deploy this as a stack — web editor or git-backed, both work —
# by setting MULTICA_RUNTIME_IMAGE in the stack's environment variables
# section, and pasting/pointing at the base file plus the overlay(s) you want.
# Leave the "re-pull image" toggle OFF while the tag only exists in the
# manager's local image store: it runs `docker pull`, which has nothing to pull
# from. On the CLI,
# `docker stack deploy` does NOT read a .env file the way `docker compose` does,
# so export the variables in your shell.
#
# Stack env vars this file reads:
#   MULTICA_RUNTIME_IMAGE        image tag to run       (default multica-runtime:latest)
#   MULTICA_WORKSPACE_ID         workspace UUID         (default unset)
#   MULTICA_DAEMON_ID            daemon/device identity (default vps-runtime)
#   MULTICA_AGENT_RUNTIME_NAME   display name           (default "VPS Runtime")

services:
  runtime:
    image: ${MULTICA_RUNTIME_IMAGE:-multica-runtime:latest}

    environment:
      # Swarm gives every new task a fresh container hostname, and the daemon
      # defaults its ID to the hostname — so without these pinned, each redeploy
      # would register as a brand new runtime and orphan the old one.
      #
      # Overridable so a second stack can run side by side for a blue/green
      # migration WITHOUT editing this file (see RUNBOOK.md). Two daemons
      # sharing an ID register as the SAME runtime: both heartbeat the same row
      # and both poll the same queue, so a task meant for one can be claimed by
      # the other. Always set MULTICA_DAEMON_ID when deploying a second stack.
      MULTICA_DAEMON_ID: "${MULTICA_DAEMON_ID:-vps-runtime}"
      MULTICA_DAEMON_DEVICE_NAME: "${MULTICA_DAEMON_ID:-vps-runtime}"
      MULTICA_AGENT_RUNTIME_NAME: "${MULTICA_AGENT_RUNTIME_NAME:-VPS Runtime}"

      MULTICA_WORKSPACES_ROOT: "/home/node/multica_workspaces"

      # Set as a STACK environment variable in Portainer, not here — that way
      # the two-phase deploy needs no git commit. Leave it unset on the first
      # deploy, then read the UUID from inside the container:
      #   multica workspace list --full-id
      # Token login is not documented to auto-discover workspaces the way the
      # browser flow is, so pin it rather than hoping.
      MULTICA_WORKSPACE_ID: "${MULTICA_WORKSPACE_ID:-}"

      # Default is 20. This runs on the MANAGER, next to the swarm control
      # plane — a runaway agent here does not just lose you the runtime, it
      # loses you the node that governs the cluster. Start at 1.
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS: "1"

      # Default is 0 = no cap, bounded only by the idle (30m) and tool (2h)
      # watchdogs. That is a long time for a wedged agent to hold CPU.
      MULTICA_AGENT_TIMEOUT: "45m"

      # GC. The real defaults are 24h (done/cancelled), 72h (orphans) and
      # 12h (build artifacts on still-open issues) — NOT 30 days.
      # Artifact patterns default to node_modules,.next,.turbo only.
      MULTICA_GC_ARTIFACT_PATTERNS: "node_modules,.next,.turbo,dist,target,__pycache__,.venv"

      GIT_AUTHOR_NAME: "Multica Agent"
      GIT_AUTHOR_EMAIL: "agent@example.com"
      GIT_SSH_KNOWN_HOSTS: "github.com"

      # Honoured now that tzdata is installed in the image.
      TZ: "America/Argentina/Buenos_Aires"

    secrets:
      - multica_token
      - git_ssh_key
      - gh_token
      # Provider auth secrets (claude_oauth_token, openai_api_key, ...) are
      # NOT declared here — each comes from the matching overlay under
      # overlays/, so a stack only needs to create the secrets its chosen
      # provider(s) actually use.

    volumes:
      # Daemon credentials, profile and state.
      - multica_state:/home/node/.multica
      # Task workdirs plus the shared bare-clone cache under .repos/.
      # This is the one that grows — watch it.
      - multica_workspaces:/home/node/multica_workspaces
      # Provider state volumes (claude_state, opencode_state, ...) are added
      # by the matching overlay under overlays/, same reasoning as above.

    # Dedicated overlay. NEVER attach this service to network_swarm_public or
    # any other shared network: overlay separation is what keeps agents away
    # from postgres, redis and every other stack on this box.
    networks:
      - multica_runtime

    # No docker socket, no host bind mounts of your production projects.
    # Tasks run with this container's full permissions; the isolation is the
    # entire point of putting it here instead of on the host.

    deploy:
      mode: replicated
      replicas: 1

      # Named volumes are node-local, so the runtime must always land on the
      # same node or it silently comes up with empty state.
      #
      # WARNING: this is only unambiguous while there is exactly ONE manager.
      # If you ever promote a second node to manager, Swarm may schedule this
      # task there and it will come up with empty volumes and a logged-out
      # Claude. At that point switch to node.hostname or a node label.
      placement:
        constraints:
          - node.role == manager

      # Belt and braces: if this service ever ends up on a Traefik-observed
      # network, exposedByDefault=true would publish it to the internet.
      labels:
        - traefik.enable=false

      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

    # The daemon deregisters its runtimes on shutdown and may have tasks in
    # flight. The 10s default is not enough, and stop-first means every update
    # goes through this path.
    stop_grace_period: 120s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  multica_token:
    external: true
  git_ssh_key:
    external: true
  gh_token:
    external: true
  # claude_oauth_token, openai_api_key, ... declared in overlays/*.yml.

volumes:
  multica_state:
  multica_workspaces:
  # claude_state, opencode_state, ... declared in overlays/*.yml.

# Stack-managed, NOT external — Swarm creates and owns it as
# multica_multica_runtime.
#
# It used to be `external: true`, which broke deploys through the Portainer
# Agent: a swarm overlay only materialises on a node once a task attaches to
# it there, so when the agent routed the deploy to the worker the external
# lookup 404'd with "declared as external, but could not be found". Owning it
# here skips that validation entirely, ties the network's lifecycle to the
# stack, and stops any other stack from joining it by declaring the name.
networks:
  multica_runtime:
